name: Build Signed Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.cfg.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Configure them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Read build variables from build-apk.sh
        id: cfg
        run: |
          build_tools="$(grep -E '^[[:space:]]*BT=\$SDK/build-tools/' build-apk.sh | tail -n 1 | sed -E 's#.*/build-tools/##; s/[^0-9.].*$//')"
          android_platform="$(grep -E '^[[:space:]]*JAR=' build-apk.sh | head -n 1 | sed -E 's#.*android-([0-9]+).*#\1#')"
          version_name="$(grep -E '^[[:space:]]*VERSION_NAME=' build-apk.sh | head -n 1 | cut -d= -f2- | tr -d "\"'")"
          out_dir="$(grep -E '^[[:space:]]*OUT=' build-apk.sh | head -n 1 | cut -d= -f2- | tr -d "\"'")"

          for var in build_tools android_platform version_name out_dir; do
            if [ -z "${!var}" ]; then
              echo "::error::Failed to parse ${var} from build-apk.sh"
              exit 1
            fi
          done

          echo "build_tools=${build_tools}" >> "$GITHUB_OUTPUT"
          echo "android_platform=${android_platform}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "out_dir=${out_dir}" >> "$GITHUB_OUTPUT"

          echo "Using build-apk.sh config: platform=${android_platform}, build-tools=${build_tools}, version=${version_name}, out=${out_dir}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ steps.cfg.outputs.android_platform }} build-tools;${{ steps.cfg.outputs.build_tools }}"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ensure zip is installed
        run: command -v zip >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Fetch pinned ML Kit libraries
        run: python3 tools/fetch_libs.py

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          keystore_path="${RUNNER_TEMP}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "NIB_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed APK with build-apk.sh
        env:
          NIB_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          NIB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NIB_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Verify APK signature and prepare output
        id: apk
        env:
          BUILD_TOOLS: ${{ steps.cfg.outputs.build_tools }}
          VERSION_NAME: ${{ steps.cfg.outputs.version_name }}
          OUT_DIR: ${{ steps.cfg.outputs.out_dir }}
        run: |
          src_apk="${OUT_DIR}/nib.apk"
          if [ ! -f "$src_apk" ]; then
            echo "::error::Expected signed APK not found at $src_apk"
            exit 1
          fi

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$src_apk"

          release_dir="${RUNNER_TEMP}/release-apk"
          mkdir -p "$release_dir"
          out_name="Nib-v${VERSION_NAME}.apk"
          cp "$src_apk" "${release_dir}/${out_name}"

          echo "release_dir=${release_dir}" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nib-v${{ steps.cfg.outputs.version_name }}-apk
          path: ${{ steps.apk.outputs.release_dir }}/Nib-v${{ steps.cfg.outputs.version_name }}.apk
          retention-days: 30

      - name: Build Magisk module zip
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        run: |
          chmod +x tools/build-magisk-module.sh
          ./tools/build-magisk-module.sh
          if [ ! -f build/nib-stylus-unblock.zip ]; then
            echo "::error::Expected Magisk module zip not found at build/nib-stylus-unblock.zip"
            exit 1
          fi

      - name: Upload Magisk module artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: nib-stylus-unblock-zip
          path: build/nib-stylus-unblock.zip
          retention-days: 30

      - name: Clean up release keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

  publish-release:
    name: Publish GitHub Release
    needs: build-signed-apk
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Nib-v${{ needs.build-signed-apk.outputs.version_name }}-apk
          path: release-assets

      - name: Download Magisk module artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: actions/download-artifact@v4
        with:
          name: nib-stylus-unblock-zip
          path: release-assets

      # --- DELETE OLD RELEASE ---
      - name: Delete Existing Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build-signed-apk.outputs.version_name }}
        run: |
          TAG_NAME="v${APP_VERSION}"
          echo "Attempting to delete release and tag: $TAG_NAME"
          gh release delete "$TAG_NAME" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG_NAME}" 2>/dev/null || true
          # Wait a moment to ensure GitHub processes the deletion
          sleep 5

      # --- CREATE NEW RELEASE ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-signed-apk.outputs.version_name }}
          name: Release v${{ needs.build-signed-apk.outputs.version_name }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
